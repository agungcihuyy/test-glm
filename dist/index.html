    <script>
      /* terapkan mode tersimpan SEBELUM CSS/React dimuat supaya tidak
         kedip terang→gelap saat halaman di-refresh */
      try {
        var t = localStorage.getItem("agung-pandu-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.querySelector('meta[name="theme-color"]').content =
            t === "light" ? "#f2f1e6" : "#0f0e0c";
        }
      } catch (e) {}
    </script>
